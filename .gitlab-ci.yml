stages:
  - sync

sync_to_github:
  stage: sync
  script:
    - git remote remove github || true
    - git remote add github https://x-access-token:$GITHUB_TOKEN@github.com/empty-labs/college-hoops.git
    - git push --force github HEAD:$CI_COMMIT_REF_NAME
    - git push --force github --tags
  only:
    - main